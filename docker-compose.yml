version: '3.8'

services:
  melodyclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melodyclaw
    ports:
      - "8000:8000"  # Main API
      - "8001:8001"  # Demucs
      - "8002:8002"  # Silero
      - "8003:8003"  # RVC
    volumes:
      - melodyclaw-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./melodyclaw.db
      - DEVICE=cpu
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G

volumes:
  melodyclaw-data:
    driver: local
